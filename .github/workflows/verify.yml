name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TypeSafe SDK
        run: python3 -m pip install -r plugins/codex-subagent-router/requirements.txt
      - name: Test router
        run: python3 -B -m unittest discover -s plugins/codex-subagent-router/tests
