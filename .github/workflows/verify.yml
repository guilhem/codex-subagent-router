name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check distributed bundle
        run: npm run check:dist
      - run: npm run build
      - name: Test router
        run: npm test
      - run: git diff --exit-code
